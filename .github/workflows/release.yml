name: Build Desktop Portable Release

# 修正：現在只要您推播（Push）程式碼到 main 或 master 分支，Actions 就會立刻啟動！
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

# 修正：強制開啟寫入權限，否則 GitHub 會報錯拒絕自動上傳編譯好的 exe 壓縮包
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: 複製程式碼
        uses: actions/checkout@v4

      - name: 配置 Flutter 環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x' # 修正：鎖定相容於您 pubspec 套件的穩定 Flutter 版本

      - name: 啟用 Windows 桌面端支援
        run: flutter config --enable-windows-desktop

      - name: 獲取依賴套件
        run: flutter pub get

      - name: 編編綠色便攜版 (Release)
        run: flutter build windows --release

      - name: 打包成 ZIP 壓縮檔
        shell: bash
        run: |
          cd build/windows/x64/runner/Release/
          zip -r ../../../../../repomix-flutter-windows-portable.zip .

      # 修正：使用更穩定的上傳機制，不管有沒有打 tag 都能自動生成一個名為 "latest" 的發布頁面
      - name: 自動發布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: repomix-flutter-windows-portable.zip
          tag_name: latest
          name: "Repomix 便攜免安裝版"
          body: "這是由 GitHub Actions 自動編譯生成的 Windows 綠色便攜版，解壓點擊 exe 即可執行。"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
