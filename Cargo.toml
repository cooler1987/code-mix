[package]
name = "repomix-portable"
version = "1.1.0"
edition = "2021"
description = "Repomix Portable - Codebase Packer & Restore Tool"

[[bin]]
name = "repomix-portable"
path = "main.rs"

[dependencies]
rfd = "0.17"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
